# pnpm settings for the app (a single project: no `packages`).

# React Native's autolinking, CocoaPods (ios/Podfile) and Gradle look for
# packages in ./node_modules/<name>: a flat node_modules, as npm and Yarn lay out.
nodeLinker: hoisted

# Peers are installed only when a package.json lists them, as Yarn 1 did:
# otherwise peers nobody uses would land at the root of node_modules.
autoInstallPeers: false

# Applied on every install; see the CLAUDE.md "patches" gotcha for why each one exists.
patchedDependencies:
  react-native-notify-kit@9.7.0: patches/react-native-notify-kit@9.7.0.patch

# Dependencies whose install scripts may run; pnpm blocks every other one.
allowBuilds:
  # Downloads the sentry-cli binary the builds upload source maps with.
  '@sentry/cli': true
  '@firebase/util': true
  protobufjs: true
  # Prints a funding banner.
  core-js: false
